<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeopardy Board</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: hidden; cursor: default; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }
  body.scores .screen { bottom: 11vh; }

  /* ---- title ---- */
  #title { background: radial-gradient(ellipse at center, #1a2cff 0%, var(--blue-deep) 55%, var(--blue-dark) 100%); align-items: center; justify-content: center; flex-direction: column; }
  #title .logo { font-size: 15vw; }
  #title .sub { margin-top: 2vh; font: 700 2.4vw var(--clue-font); color: var(--gold); letter-spacing: 0.3em; text-transform: uppercase; }

  /* ---- board ---- */
  #board { display: none; padding: 0.7vh; gap: 0.7vh; background: #000; }
  #board.on { display: grid; }
  .cat, .tile {
    background: var(--blue);
    box-shadow: inset 0 0 0 0.25vh #000, inset 0 0 3vh rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .cat {
    padding: 1vh 0.8vw; text-transform: uppercase; color: #fff;
    font: 800 2.3vw/1.12 var(--value-font); font-stretch: condensed;
    text-shadow: 0.1vw 0.1vw 0 #000; overflow-wrap: anywhere;
  }
  .cat .logo { font-size: 2.6vw; }
  .cat.flip { animation: catflip .7s ease-out; }
  @keyframes catflip { 0% { transform: perspective(60vw) rotateX(90deg); } 60% { transform: perspective(60vw) rotateX(-12deg); } 100% { transform: none; } }
  .tile .money { font-size: min(5.4vw, 10vh); color: var(--gold-deep); text-shadow: 0.25vw 0.25vw 0 #000; transition: opacity .15s; }
  .tile.hid .money { opacity: 0; }
  .cat-row-gap { grid-column: 1 / -1; height: 0; }

  /* ---- clue ---- */
  #clue { background: var(--blue); flex-direction: column; align-items: center; justify-content: center; padding: 6vh 7vw; text-align: center; }
  /* opening a clue: the card lifts off its square showing the $ value, grows over the board, then becomes the clue */
  #clue .fly { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--gold-deep); text-shadow: .04em .04em 0 #000; pointer-events: none; }
  #clue.zooming .fly { display: flex; }
  #clue.zooming { box-shadow: inset 0 0 0 .25vh #000, inset 0 0 3vh rgba(0,0,0,.45); }
  #clue .meta { position: absolute; top: 3vh; left: 0; right: 0; font: 800 2vw var(--value-font); color: #fff; opacity: .75; text-transform: uppercase; letter-spacing: .05em; }
  #clue .clue-text { font-size: 5vw; max-width: 90vw; }
  #clue .answer { margin-top: 5vh; font: 700 3.4vw var(--clue-font); color: var(--gold); text-shadow: .2vw .2vw 0 #000; text-transform: uppercase; }
  #clue .who {
    position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%);
    background: var(--blue-dark); border: .4vh solid #fff; padding: 1vh 4vw; border-radius: .6vh;
    font: 4vw var(--hand-font); color: #fff; white-space: nowrap; display: none;
  }
  #clue .who.on { display: block; }
  .lights { position: absolute; left: 0; right: 0; bottom: 0; height: 1.4vh; }
  .lights i { display: block; height: 100%; background: linear-gradient(#fff6c0, #ffb800); box-shadow: 0 0 2vh #ffcc00; transform-origin: center; transform: scaleX(0); }

  /* ---- daily double ---- */
  #dd { align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(circle, #3b1fff 0%, #1300a0 45%, #06004a 100%); }
  #dd .logo { font-size: 12vw; line-height: .95; text-align: center; color: var(--gold); animation: ddspin 1.1s cubic-bezier(.2,.8,.3,1.1); }
  #dd .wager { margin-top: 5vh; font-size: 4vw; font-family: var(--value-font); font-weight: 800; }
  @keyframes ddspin { from { transform: scale(0) rotate(-720deg); } to { transform: scale(1) rotate(0); } }

  /* ---- final ---- */
  #final { background: var(--blue); flex-direction: column; align-items: center; justify-content: center; padding: 6vh 7vw; text-align: center; }
  #final .logo { font-size: 7vw; margin-bottom: 5vh; }
  #final .category { font: 800 6vw var(--value-font); font-stretch: condensed; text-transform: uppercase; text-shadow: .3vw .3vw 0 #000; }
  #final .clue-text { font-size: 4.6vw; }
  #final .answer { margin-top: 5vh; font: 700 3.4vw var(--clue-font); color: var(--gold); text-transform: uppercase; text-shadow: .2vw .2vw 0 #000; }
  #final .pname { font: 800 4vw var(--value-font); text-transform: uppercase; }
  #final .resp { margin: 4vh 0; min-width: 50vw; padding: 3vh 4vw; background: var(--blue-dark); border: .5vh solid #fff; font: 6vw var(--hand-font); }
  #final .resp.empty { opacity: .5; }
  #final .wg { font: 800 5vw var(--value-font); color: var(--gold); }
  #final .verdict { font: 800 3vw var(--value-font); margin-top: 1vh; }
  #final .lights { height: 1.6vh; }

  /* ---- end ---- */
  #end { background: radial-gradient(ellipse at center, #1a2cff 0%, var(--blue-deep) 55%, var(--blue-dark) 100%); flex-direction: column; align-items: center; justify-content: center; }
  #end .logo { font-size: 6vw; margin-bottom: 6vh; }
  #end .row { display: flex; gap: 3vw; }
  #end .pl { background: var(--blue); border: .4vh solid #fff; padding: 3vh 3vw; text-align: center; min-width: 22vw; }
  #end .pl .n { font: 3.6vw var(--hand-font); }
  #end .pl .money { font-size: 5vw; margin-top: 1vh; }
  #end .pl.win { border-color: var(--gold); box-shadow: 0 0 5vh var(--gold); }
  #end .pl.win::before { content: "CHAMPION"; display: block; color: var(--gold); font: 800 1.8vw var(--value-font); letter-spacing: .2em; margin-bottom: 1vh; }

  /* ---- scores strip ---- */
  #scores { position: fixed; left: 0; right: 0; bottom: 0; height: 11vh; display: none; background: #000; gap: .7vh; padding: .7vh; }
  body.scores #scores { display: flex; }
  #scores div { flex: 1; background: var(--blue); display: flex; align-items: center; justify-content: space-around; box-shadow: inset 0 0 3vh rgba(0,0,0,.4); }
  #scores .n { font: 3vw var(--hand-font); }
  #scores .money { font-size: 4vw; }

  /* ---- click-to-start overlay (browsers need a click before playing sound) ---- */
  #unlock { position: fixed; inset: 0; background: rgba(0,0,20,.85); display: grid; place-content: center; text-align: center; z-index: 50; cursor: pointer; }
  #unlock b { font-size: 36px; display: block; margin-bottom: 10px; }
  #unlock span { font-size: 18px; opacity: .8; }
  #fs { position: fixed; right: 10px; top: 10px; z-index: 40; opacity: 0; transition: opacity .2s; background: rgba(0,0,0,.6); color: #fff; border: 1px solid #fff5; border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  body:hover #fs { opacity: .8; }
</style>
</head>
<body>
<div id="title" class="screen"><div class="logo">JEOPARDY!</div><div class="sub">Get ready to play</div></div>
<div id="board" class="screen"></div>
<div id="clue" class="screen">
  <div class="fly money"></div>
  <div class="meta"></div>
  <div class="clue-text"></div>
  <div class="answer"></div>
  <div class="who"></div>
  <div class="lights"><i data-timerbar></i></div>
</div>
<div id="dd" class="screen"><div class="logo">DAILY<br>DOUBLE</div><div class="wager"></div></div>
<div id="final" class="screen"></div>
<div id="end" class="screen"></div>
<div id="scores"></div>
<button id="fs">Full screen</button>
<div id="unlock"><b>Click to start the game board</b><span>This turns on sound. Double-click the board any time for full screen.</span></div>

<script src="mode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="common.js"></script>
<script>
// ------------------------------------------------------------ sound (generated, no audio files)
const Snd = {
  ctx: null, out: null, thinkBus: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.out = this.ctx.createGain(); this.out.gain.value = 0.8; this.out.connect(this.ctx.destination);
  },
  tone(freq, start, dur, { type = 'sine', vol = 0.2, bus = this.out, glide } = {}) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, start + dur);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol, start + 0.01);
    g.gain.setValueAtTime(vol, Math.max(start + 0.01, start + dur - 0.04));
    g.gain.linearRampToValueAtTime(0, start + dur);
    o.connect(g).connect(bus); o.start(start); o.stop(start + dur + 0.05);
  },
  midi: n => 440 * Math.pow(2, (n - 69) / 12),
  play(id, extra) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + 0.03;
    if (id === 'fill') {
      for (let i = 0; i < 30; i++) this.tone(700 + Math.random() * 1100, t + i * 0.055, 0.045, { type: 'square', vol: 0.04 });
    } else if (id === 'timesup') {
      [0, 0.22, 0.44].forEach(d => this.tone(196, t + d, 0.17, { type: 'triangle', vol: 0.35 }));
    } else if (id === 'dd') {
      this.tone(180, t, 1.0, { type: 'sawtooth', vol: 0.08, glide: 1800 });
      for (let i = 0; i < 12; i++) this.tone(this.midi(84 + (i % 4) * 3), t + 0.9 + i * 0.05, 0.08, { vol: 0.08 });
    } else if (id === 'final') {
      [60, 64, 67, 72].forEach((n, i) => this.tone(this.midi(n), t + i * 0.12, 1.4 - i * 0.12, { type: 'triangle', vol: 0.12 }));
    } else if (id === 'reveal') {
      this.tone(320, t, 0.28, { type: 'sine', vol: 0.12, glide: 900 });
      this.tone(this.midi(79), t + 0.22, 0.35, { type: 'triangle', vol: 0.1 });
    } else if (id === 'think') {
      this.think(extra || 30);
    } else if (id === 'stop') {
      this.stopThink();
    }
  },
  // An original little "thinking" tune (music-box melody over a ticking clock) that fits the timer.
  think(seconds) {
    this.stopThink();
    const c = this.ctx;
    this.thinkBus = c.createGain(); this.thinkBus.gain.value = 1; this.thinkBus.connect(this.out);
    const bus = this.thinkBus;
    const beat = 0.5, beats = Math.floor(seconds / beat);
    const t0 = c.currentTime + 0.05;
    const melody = [76, 79, 81, 79, 76, 74, 72, 74, 76, 76, 74, 72, 74, null, null, null,
                    76, 79, 81, 84, 81, 79, 76, 79, 81, 79, 76, 74, 72, null, null, null];
    const bass = [48, 43, 45, 41];
    for (let b = 0; b < beats - 1; b++) {
      const t = t0 + b * beat;
      this.tone(b % 2 ? 1500 : 1900, t, 0.03, { type: 'square', vol: 0.03, bus });           // tick-tock
      if (b % 2 === 0) this.tone(this.midi(bass[Math.floor(b / 4) % 4]), t, beat * 1.8, { type: 'triangle', vol: 0.12, bus });
      const n = melody[b % melody.length];
      if (n) this.tone(this.midi(n), t, beat * 0.9, { vol: 0.1, bus });
    }
    const end = t0 + (beats - 1) * beat;
    [48, 60, 64, 67, 72].forEach(n => this.tone(this.midi(n), end, 1.2, { type: 'triangle', vol: 0.1, bus }));
  },
  stopThink() {
    if (!this.thinkBus) return;
    const g = this.thinkBus; this.thinkBus = null;
    g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
    setTimeout(() => g.disconnect(), 400);
  },
};

// ------------------------------------------------------------ rendering
const $ = id => document.getElementById(id);
let seenSfx = null, seenFill = null, lastClueKey = null, fillTimers = [], zoom = null, seenCats = null;

function show(id) {
  if (zoom && id !== 'clue') stopZoom();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}

function render(s) {
  document.body.classList.toggle('scores', !!s.settings.boardScores && s.view !== 'end');
  renderScores(s);

  if (s.view === 'title') { show('title'); lastClueKey = null; }
  else if (s.view === 'board') { renderBoard(s); show('board'); lastClueKey = null; }
  else if (s.view === 'clue' && s.clue) renderClue(s);
  else if (s.view === 'final' && s.final) { renderFinal(s); show('final'); }
  else if (s.view === 'end') { renderEnd(s); show('end'); }

  // sound effects
  if (seenSfx === null) seenSfx = s.sfx.seq;
  else if (s.sfx.seq !== seenSfx) {
    seenSfx = s.sfx.seq;
    Snd.play(s.sfx.id, s.final && s.final.timer ? J.remaining(s.final.timer) / 1000 : s.settings.finalTime);
  }
  if (!(s.final && s.final.step === 'thinking')) Snd.stopThink();
}

function renderBoard(s) {
  const b = s.board || [];
  const el = $('board');
  el.style.gridTemplateColumns = `repeat(${Math.max(b.length, 1)}, 1fr)`;
  const rows = Math.max(1, ...b.map(c => c.clues.length));
  el.style.gridTemplateRows = `1.35fr repeat(${rows}, 1fr)`;
  // Category headings: the JEOPARDY! logo until revealed, blank once every clue is played
  const shown = s.catsShown == null ? b.length : s.catsShown;
  const prevShown = seenCats && seenCats.fill === s.fillSeq ? seenCats.shown : shown;
  seenCats = { fill: s.fillSeq, shown };
  let html = b.map((c, i) => {
    if (c.name == null) return `<div class="cat"><span class="logo">JEOPARDY!</span></div>`;
    if (c.clues.every(x => x.used)) return `<div class="cat"></div>`;
    return `<div class="cat">${J.esc(c.name)}</div>`;
  }).join('');
  for (let r = 0; r < rows; r++) {
    html += b.map((c, ci) => {
      const cl = c.clues[r];
      return `<div class="tile" data-k="${ci}-${r}">${cl && !cl.used ? `<span class="money">$${cl.value}</span>` : ''}</div>`;
    }).join('');
  }
  // Only rebuild when the board actually changed, so animations aren't cut short
  if (html !== el._html) { el.innerHTML = html; el._html = html; }
  const heads = el.querySelectorAll('.cat');
  for (let i = prevShown; i < shown; i++) if (heads[i] && b[i].name != null) {
    heads[i].classList.remove('flip'); void heads[i].offsetWidth; heads[i].classList.add('flip');
  }

  // board-fill animation at the start of each round
  if (seenFill === null) seenFill = s.fillSeq;
  if (s.fillSeq !== seenFill) {
    seenFill = s.fillSeq;
    fillTimers.forEach(clearTimeout); fillTimers = [];
    const tiles = [...el.querySelectorAll('.tile')];
    tiles.forEach(t => t.classList.add('hid'));
    tiles.sort(() => Math.random() - 0.5).forEach((t, i) => {
      fillTimers.push(setTimeout(() => {
        const cur = el.querySelector(`.tile[data-k="${t.dataset.k}"]`);
        if (cur) cur.classList.remove('hid');
        el._revealed = (el._revealed || new Set()).add(t.dataset.k);
      }, 150 + i * (1500 / tiles.length)));
    });
    el._revealed = new Set();
  } else if (fillTimers.length && el._revealed) {
    // re-rendered mid-animation: keep not-yet-revealed tiles hidden
    el.querySelectorAll('.tile').forEach(t => { if (!el._revealed.has(t.dataset.k)) t.classList.add('hid'); });
  }
}

function renderClue(s) {
  const c = s.clue;
  const key = `${s.round}-${c.c}-${c.r}`;
  if (c.dd && !c.shown) {
    $('dd').querySelector('.wager').textContent = '';
    if (lastClueKey !== key) { const l = $('dd').querySelector('.logo'); l.style.animation = 'none'; l.offsetHeight; l.style.animation = ''; }
    show('dd'); lastClueKey = key; return;
  }
  const el = $('clue');
  const isNew = lastClueKey !== key;
  lastClueKey = key;
  el.querySelector('.meta').textContent = `${c.cat}  ·  ${c.dd ? 'Daily Double · ' + J.money(c.ddWager) : J.money(c.value)}`;
  el.querySelector('.clue-text').textContent = c.text || '';
  el.querySelector('.answer').textContent = c.answer || '';
  const who = el.querySelector('.who');
  const p = c.dd ? c.ddPlayer : c.buzzed;
  who.textContent = p != null ? s.players[p].name : '';
  who.classList.toggle('on', p != null && !c.answer);
  const bar = el.querySelector('[data-timerbar]');
  bar._timer = c.buzz === 'open' ? c.buzzTimer : null;

  const tile = $('board').classList.contains('on') && $('board').querySelector(`.tile[data-k="${c.c}-${c.r}"]`);
  if (isNew && !c.dd && tile) zoomFrom(tile, c);
  else if (!zoom) show('clue'); // mid-zoom updates wait for the zoom to finish
}

// Grow the clue screen out of its square on the board, which stays visible behind it.
function zoomFrom(tile, c) {
  stopZoom();
  const el = $('clue');
  const fly = el.querySelector('.fly');
  const money = tile.querySelector('.money');
  const tileFont = money ? parseFloat(getComputedStyle(money).fontSize) : 60;
  const from = tile.getBoundingClientRect();
  el.classList.add('on', 'zooming');               // on top of the board; board stays on
  const to = el.getBoundingClientRect();
  const sx = from.width / to.width, sy = from.height / to.height;
  fly.textContent = '$' + c.value;
  fly.style.fontSize = tileFont / ((sx + sy) / 2) + 'px'; // looks tile-sized at the start
  tile.innerHTML = '';                              // the value lifts off its square

  const T = 600, opts = { duration: T, fill: 'both' };
  const content = [...el.children].filter(n => n !== fly);
  const anims = [
    el.animate([
      { transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${sx}, ${sy})`, transformOrigin: '0 0' },
      { transform: 'none', transformOrigin: '0 0' },
    ], { ...opts, easing: 'cubic-bezier(.45, 0, .25, 1)' }),
    fly.animate([{ opacity: 1 }, { opacity: 1, offset: 0.55 }, { opacity: 0, offset: 0.8 }, { opacity: 0 }], opts),
    ...content.map(n => n.animate([{ opacity: 0 }, { opacity: 0, offset: 0.6 }, { opacity: 1 }], opts)),
  ];
  zoom = { anims };
  anims[0].onfinish = () => { if (zoom && zoom.anims === anims) { stopZoom(); show('clue'); } };
}

function stopZoom() {
  if (!zoom) return;
  zoom.anims.forEach(a => a.cancel());
  zoom = null;
  $('clue').classList.remove('zooming');
}

function renderFinal(s) {
  const f = s.final, el = $('final');
  if (f.step === 'category') {
    el.innerHTML = `<div class="logo">FINAL JEOPARDY!</div><div class="category">${J.esc(f.category)}</div>`;
  } else if (f.step === 'reveal' && f.cur != null) {
    const i = f.cur, res = f.results[i], resp = f.answers[i];
    el.innerHTML = `<div class="pname">${J.esc(s.players[i].name)}</div>
      <div class="resp ${resp ? '' : 'empty'}">${resp ? J.esc(resp) : '(no response)'}</div>
      ${res ? `<div class="wg">Wager: ${J.money(f.wagers[i])}</div>
               <div class="verdict" style="color:${res.correct ? 'var(--green)' : 'var(--red)'}">${res.correct ? 'CORRECT' : 'INCORRECT'} · NOW ${J.money(s.players[i].score)}</div>` : ''}`;
  } else {
    el.innerHTML = `<div class="clue-text">${J.esc(f.text || '')}</div>
      ${f.answer ? `<div class="answer">${J.esc(f.answer)}</div>` : ''}
      <div class="lights"><i data-timerbar></i></div>`;
    el.querySelector('[data-timerbar]')._timer = f.step === 'thinking' ? f.timer : null;
  }
}

function renderEnd(s) {
  const best = Math.max(...s.players.map(p => p.score));
  $('end').innerHTML = `<div class="logo">FINAL SCORES</div><div class="row">${s.players.map(p =>
    `<div class="pl ${p.score === best && best > 0 ? 'win' : ''}"><div class="n">${J.esc(p.name)}</div><div class="money ${p.score < 0 ? 'neg' : ''}">${J.money(p.score)}</div></div>`
  ).join('')}</div>`;
}

function renderScores(s) {
  $('scores').innerHTML = s.players.map(p =>
    `<div><span class="n">${J.esc(p.name)}</span><span class="money ${p.score < 0 ? 'neg' : ''}">${J.money(p.score)}</span></div>`).join('');
}

// ------------------------------------------------------------ startup
if (!J.needRoom('Game board')) {
$('unlock').onclick = () => {
  Snd.init();
  $('unlock').remove();
  document.documentElement.requestFullscreen?.().catch(() => {});
};
const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$('fs').onclick = toggleFs;
addEventListener('dblclick', toggleFs);

J.connect('board', null, render);
J.forwardBuzzers();
}
</script>
</body>
</html>
